<header class="site-header">
    <nav>
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'about' %}">О проекте</a>
        <a href="{% url 'notes:notes_list' %}">Список заметок</a>

        {% if user.is_authenticated %}
            <a href="{% url 'accounts:dashboard' %}">Кабинет</a>
            <form method="post" action="{% url 'accounts:logout' %}" class="nav-logout-form">
                {% csrf_token %}
                <button type="submit" class="nav-logout">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Войти</a>
            <a href="{% url 'accounts:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
