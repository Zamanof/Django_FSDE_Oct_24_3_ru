{% extends 'base.html' %}

{% block title %}
	Регистрация
{% endblock %}

{% block content %}
	<h1>Регистрация</h1>
    {% if form.non_field_errors %}
        <div class="form-error">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
{% endblock %}
